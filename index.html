<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Cadastro de Clientes</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #222;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #555;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 15px;
        }

        .cadastrar {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: black;
            color: white;
        }

        .cadastrar:hover {
            background: #333;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .resumo {
            background: white;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .resumo-numero {
            display: block;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .resumo-texto {
            color: #666;
            font-size: 14px;
        }

        .pesquisa-area {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .pesquisa-area input {
            flex: 1;
            margin-bottom: 0;
        }

        .limpar-pesquisa {
            background: #ddd;
            color: #222;
            white-space: nowrap;
        }

        .limpar-pesquisa:hover {
            background: #ccc;
        }

        li {
            background: white;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 10px;
            list-style: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-left: 4px solid black;
        }

        .editar {
            background: #555;
            color: white;
            margin-top: 12px;
            margin-right: 5px;
        }

        .editar:hover {
            background: #333;
        }

        .excluir {
            background: #d00000;
            color: white;
            margin-top: 12px;
        }

        .excluir:hover {
            background: #a00000;
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .card {
                padding: 18px;
            }

            h1 {
                font-size: 25px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .pesquisa-area {
                flex-direction: column;
            }

            .limpar-pesquisa {
                width: 100%;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>Sistema de Cadastro de Clientes</h1>


    <!-- PAINEL DE RESUMO -->

    <div class="dashboard">

        <div class="resumo">

            <span
                class="resumo-numero"
                id="totalClientes"
            >
                0
            </span>

            <span class="resumo-texto">
                Total de clientes
            </span>

        </div>


        <div class="resumo">

            <span
                class="resumo-numero"
                id="clientesEncontrados"
            >
                0
            </span>

            <span class="resumo-texto">
                Encontrados
            </span>

        </div>


        <div class="resumo">

            <span
                class="resumo-numero"
                id="ultimoCliente"
            >
                -
            </span>

            <span class="resumo-texto">
                Último cliente
            </span>

        </div>

    </div>


    <!-- CADASTRO -->

    <div class="card">

        <h2 id="titulo">
            Cadastrar cliente
        </h2>


        <label>Nome:</label>

        <input
            type="text"
            id="nome"
            placeholder="Digite o nome"
        >


        <label>Telefone:</label>

        <input
            type="tel"
            id="telefone"
            placeholder="Digite o telefone"
        >


        <label>E-mail:</label>

        <input
            type="email"
            id="email"
            placeholder="Digite o e-mail"
        >


        <button
            class="cadastrar"
            onclick="cadastrarCliente()"
        >
            Cadastrar
        </button>

    </div>


    <!-- LISTA -->

    <div class="card">

        <h2>Clientes cadastrados</h2>


        <div class="pesquisa-area">

            <input
                type="text"
                id="pesquisa"
                placeholder="🔎 Pesquisar cliente..."
                oninput="mostrarClientes()"
            >


            <button
                class="limpar-pesquisa"
                onclick="limparPesquisa()"
            >
                Limpar pesquisa
            </button>

        </div>


        <ul id="lista"></ul>

    </div>

</div>


<script>


let clientes =
    JSON.parse(localStorage.getItem("clientes")) || [];


let clienteEditando = -1;



function cadastrarCliente() {

    let nome =
        document.getElementById("nome").value;


    let telefone =
        document.getElementById("telefone").value;


    let email =
        document.getElementById("email").value;


    if (
        nome === "" ||
        telefone === "" ||
        email === ""
    ) {

        alert("Preencha todos os campos!");

        return;
    }


    if (clienteEditando === -1) {

        clientes.push({

            nome: nome,
            telefone: telefone,
            email: email

        });

        alert("Cliente cadastrado com sucesso!");

    } else {

        clientes[clienteEditando] = {

            nome: nome,
            telefone: telefone,
            email: email

        };


        clienteEditando = -1;


        document.getElementById("titulo").textContent =
            "Cadastrar cliente";


        document.querySelector(".cadastrar").textContent =
            "Cadastrar";


        alert("Cliente editado com sucesso!");

    }


    salvar();

    limparCampos();

    mostrarClientes();

}



function mostrarClientes() {

    let lista =
        document.getElementById("lista");


    let pesquisa =
        document
            .getElementById("pesquisa")
            .value
            .toLowerCase();


    lista.innerHTML = "";


    let encontrados = 0;


    clientes.forEach(function(cliente, indice) {

        let dados =
            cliente.nome + " " +
            cliente.telefone + " " +
            cliente.email;


        if (
            !dados
                .toLowerCase()
                .includes(pesquisa)
        ) {

            return;

        }


        encontrados++;


        let item =
            document.createElement("li");


        item.innerHTML =
            "<strong>Nome:</strong> " +
            cliente.nome +
            "<br>" +

            "<strong>Telefone:</strong> " +
            cliente.telefone +
            "<br>" +

            "<strong>E-mail:</strong> " +
            cliente.email +
            "<br>";


        let editar =
            document.createElement("button");


        editar.textContent =
            "✏️ Editar";


        editar.className =
            "editar";


        editar.onclick =
            function() {

                editarCliente(indice);

            };


        let excluir =
            document.createElement("button");


        excluir.textContent =
            "🗑️ Excluir";


        excluir.className =
            "excluir";


        excluir.onclick =
            function() {

                excluirCliente(indice);

            };


        item.appendChild(editar);

        item.appendChild(excluir);

        lista.appendChild(item);

    });


    atualizarPainel(encontrados);

}



function atualizarPainel(encontrados) {

    document.getElementById("totalClientes").textContent =
        clientes.length;


    document.getElementById("clientesEncontrados").textContent =
        encontrados;


    if (clientes.length > 0) {

        document.getElementById("ultimoCliente").textContent =
            clientes[clientes.length - 1].nome;

    } else {

        document.getElementById("ultimoCliente").textContent =
            "-";

    }

}



function editarCliente(indice) {

    document.getElementById("nome").value =
        clientes[indice].nome;


    document.getElementById("telefone").value =
        clientes[indice].telefone;


    document.getElementById("email").value =
        clientes[indice].email;


    clienteEditando = indice;


    document.getElementById("titulo").textContent =
        "Editar cliente";


    document.querySelector(".cadastrar").textContent =
        "Salvar alterações";


    window.scrollTo(0, 0);

}



function excluirCliente(indice) {

    let confirmar =
        confirm("Deseja excluir este cliente?");


    if (confirmar) {

        clientes.splice(indice, 1);

        salvar();

        mostrarClientes();

    }

}



function salvar() {

    localStorage.setItem(
        "clientes",
        JSON.stringify(clientes)
    );

}



function limparCampos() {

    document.getElementById("nome").value = "";

    document.getElementById("telefone").value = "";

    document.getElementById("email").value = "";

}



function limparPesquisa() {

    document.getElementById("pesquisa").value = "";

    mostrarClientes();

}



mostrarClientes();


</script>

</body>

</html>
