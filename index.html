<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Cadastro de Clientes</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 15px;
        }

        .cadastrar {
            width: 100%;
            background: black;
            color: white;
            padding: 13px;
            margin-top: 10px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .resumo {
            background: white;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .numero {
            display: block;
            font-size: 22px;
            font-weight: bold;
        }

        .texto {
            color: #666;
            font-size: 14px;
        }

        .exportar {
            width: 100%;
            background: #222;
            color: white;
            margin-bottom: 15px;
        }

        .pesquisa {
            margin-bottom: 15px;
        }

        .limpar {
            background: #ddd;
            margin-bottom: 15px;
        }

        li {
            background: #eee;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            list-style: none;
        }

        .editar {
            background: #555;
            color: white;
            margin-top: 10px;
            margin-right: 5px;
        }

        .excluir {
            background: #d00000;
            color: white;
            margin-top: 10px;
        }

        .data {
            color: #666;
            margin-top: 8px;
        }

        @media (max-width: 600px) {

            .dashboard {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>Sistema de Cadastro de Clientes</h1>


    <div class="dashboard">

        <div class="resumo">

            <span
                class="numero"
                id="total">
                0
            </span>

            <span class="texto">
                Total de clientes
            </span>

        </div>


        <div class="resumo">

            <span
                class="numero"
                id="encontrados">
                0
            </span>

            <span class="texto">
                Encontrados
            </span>

        </div>


        <div class="resumo">

            <span
                class="numero"
                id="ultimo">
                -
            </span>

            <span class="texto">
                Último cliente
            </span>

        </div>

    </div>


    <div class="card">

        <h2 id="titulo">
            Cadastrar cliente
        </h2>


        <label>Nome:</label>

        <input
            type="text"
            id="nome"
            placeholder="Digite o nome"
        >


        <label>Telefone:</label>

        <input
            type="tel"
            id="telefone"
            placeholder="Digite o telefone"
        >


        <label>E-mail:</label>

        <input
            type="email"
            id="email"
            placeholder="Digite o e-mail"
        >


        <button
            class="cadastrar"
            onclick="cadastrar()">

            Cadastrar

        </button>

    </div>


    <div class="card">

        <h2>Clientes cadastrados</h2>


        <button
            class="exportar"
            onclick="exportar()">

            📥 Exportar clientes

        </button>


        <input
            class="pesquisa"
            type="text"
            id="pesquisa"
            placeholder="🔎 Pesquisar cliente..."
            oninput="mostrar()"
        >


        <button
            class="limpar"
            onclick="limparPesquisa()">

            Limpar pesquisa

        </button>


        <ul id="lista"></ul>

    </div>

</div>


<script>


let clientes =
    JSON.parse(
        localStorage.getItem("clientes")
    ) || [];


let editando = -1;



function cadastrar() {

    let nome =
        document.getElementById("nome").value.trim();

    let telefone =
        document.getElementById("telefone").value.trim();

    let email =
        document.getElementById("email").value.trim();


    if (
        nome === "" ||
        telefone === "" ||
        email === ""
    ) {

        alert("Preencha todos os campos!");

        return;
    }


    if (editando === -1) {

        clientes.push({

            nome: nome,

            telefone: telefone,

            email: email,

            data:
                new Date().toLocaleDateString("pt-BR")

        });


        alert("Cliente cadastrado com sucesso!");

    } else {

        clientes[editando].nome = nome;

        clientes[editando].telefone = telefone;

        clientes[editando].email = email;


        editando = -1;


        document.getElementById("titulo").textContent =
            "Cadastrar cliente";


        document.querySelector(".cadastrar").textContent =
            "Cadastrar";


        alert("Cliente editado com sucesso!");

    }


    salvar();

    limparCampos();

    mostrar();

}



function mostrar() {

    let lista =
        document.getElementById("lista");


    let pesquisa =
        document.getElementById("pesquisa")
        .value
        .toLowerCase();


    lista.innerHTML = "";


    let quantidade = 0;


    clientes.forEach(function(cliente, indice) {

        let texto =
            cliente.nome + " " +
            cliente.telefone + " " +
            cliente.email;


        if (
            !texto
            .toLowerCase()
            .includes(pesquisa)
        ) {

            return;

        }


        quantidade++;


        let item =
            document.createElement("li");


        item.innerHTML =
            "<strong>Nome:</strong> " +
            cliente.nome +
            "<br>" +

            "<strong>Telefone:</strong> " +
            cliente.telefone +
            "<br>" +

            "<strong>E-mail:</strong> " +
            cliente.email +
            "<br>" +

            "<div class='data'>" +
            "📅 Cadastrado em: " +
            cliente.data +
            "</div>";


        let editar =
            document.createElement("button");


        editar.textContent =
            "✏️ Editar";


        editar.className =
            "editar";


        editar.onclick =
            function() {

                editarCliente(indice);

            };


        let excluir =
            document.createElement("button");


        excluir.textContent =
            "🗑️ Excluir";


        excluir.className =
            "excluir";


        excluir.onclick =
            function() {

                excluirCliente(indice);

            };


        item.appendChild(editar);

        item.appendChild(excluir);

        lista.appendChild(item);

    });


    document.getElementById("total")
        .textContent = clientes.length;


    document.getElementById("encontrados")
        .textContent = quantidade;


    if (clientes.length > 0) {

        document.getElementById("ultimo")
            .textContent =
            clientes[clientes.length - 1].nome;

    } else {

        document.getElementById("ultimo")
            .textContent = "-";

    }

}



function editarCliente(indice) {

    document.getElementById("nome").value =
        clientes[indice].nome;


    document.getElementById("telefone").value =
        clientes[indice].telefone;


    document.getElementById("email").value =
        clientes[indice].email;


    editando = indice;


    document.getElementById("titulo").textContent =
        "Editar cliente";


    document.querySelector(".cadastrar").textContent =
        "Salvar alterações";


    window.scrollTo(0, 0);

}



function excluirCliente(indice) {

    let confirmar =
        confirm(
            "Deseja excluir este cliente?"
        );


    if (confirmar) {

        clientes.splice(indice, 1);

        salvar();

        mostrar();

    }

}



function salvar() {

    localStorage.setItem(
        "clientes",
        JSON.stringify(clientes)
    );

}



function limparCampos() {

    document.getElementById("nome").value = "";

    document.getElementById("telefone").value = "";

    document.getElementById("email").value = "";

}



function limparPesquisa() {

    document.getElementById("pesquisa").value = "";

    mostrar();

}



/* EXPORTAR */

function exportar() {

    if (clientes.length === 0) {

        alert(
            "Cadastre pelo menos um cliente antes de exportar."
        );

        return;
    }


    let csv =
        "Nome,Telefone,E-mail,Data de cadastro\n";


    clientes.forEach(function(cliente) {

        csv +=
            '"' +
            cliente.nome.replace(/"/g, '""') +
            '",' +

            '"' +
            cliente.telefone.replace(/"/g, '""') +
            '",' +

            '"' +
            cliente.email.replace(/"/g, '""') +
            '",' +

            '"' +
            cliente.data +
            '"\n';

    });


    let arquivo =
        new Blob(
            ["\ufeff" + csv],
            {
                type: "text/csv;charset=utf-8;"
            }
        );


    let url =
        URL.createObjectURL(arquivo);


    let link =
        document.createElement("a");


    link.href = url;

    link.download = "clientes.csv";

    link.style.display = "none";


    document.body.appendChild(link);


    link.click();


    document.body.removeChild(link);


    setTimeout(function() {

        URL.revokeObjectURL(url);

    }, 100);

}


mostrar();


</script>

</body>

</html>
