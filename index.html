<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Cadastro de Clientes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 5px;
            padding: 10px;
        }

        .cadastrar {
            width: 100%;
            background: black;
            color: white;
        }

        li {
            background: #eee;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            list-style: none;
        }

        .editar {
            background: #555;
            color: white;
            margin-top: 10px;
            margin-right: 5px;
        }

        .excluir {
            background: red;
            color: white;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Sistema de Cadastro de Clientes</h1>

    <div class="card">

        <h2 id="titulo">Cadastrar cliente</h2>

        <label>Nome:</label>
        <input type="text" id="nome">

        <label>Telefone:</label>
        <input type="tel" id="telefone">

        <label>E-mail:</label>
        <input type="email" id="email">

        <button class="cadastrar" onclick="cadastrarCliente()">
            Cadastrar
        </button>

    </div>

    <div class="card">

        <h2>Clientes cadastrados</h2>
        
<p id="contador">Clientes cadastrados: 0</p>

        <input
            type="text"
            id="pesquisa"
            placeholder="🔎 Pesquisar cliente..."
            oninput="mostrarClientes()"
        >

        <ul id="lista"></ul>

    </div>

</div>

<script>

let clientes = JSON.parse(localStorage.getItem("clientes")) || [];

let clienteEditando = -1;


function cadastrarCliente() {

    let nome = document.getElementById("nome").value;
    let telefone = document.getElementById("telefone").value;
    let email = document.getElementById("email").value;


    if (nome === "" || telefone === "" || email === "") {

        alert("Preencha todos os campos!");

        return;
    }


    if (clienteEditando === -1) {

        clientes.push({
            nome: nome,
            telefone: telefone,
            email: email
        });

        alert("Cliente cadastrado com sucesso!");

    } else {

        clientes[clienteEditando] = {
            nome: nome,
            telefone: telefone,
            email: email
        };

        clienteEditando = -1;

        document.getElementById("titulo").textContent =
            "Cadastrar cliente";

        document.querySelector(".cadastrar").textContent =
            "Cadastrar";

        alert("Cliente editado com sucesso!");
    }


    localStorage.setItem(
        "clientes",
        JSON.stringify(clientes)
    );


    limparCampos();

    mostrarClientes();
}


function mostrarClientes() {

    let lista = document.getElementById("lista");
    
    document.getElementById("contador").textContent =
    "Clientes cadastrados: " + clientes.length;

    let pesquisa =
        document.getElementById("pesquisa").value.toLowerCase();


    lista.innerHTML = "";


    clientes.forEach(function(cliente, indice) {

        let dados =
            cliente.nome + " " +
            cliente.telefone + " " +
            cliente.email;


        if (!dados.toLowerCase().includes(pesquisa)) {

            return;
        }


        let item = document.createElement("li");


        item.innerHTML =
            "<strong>Nome:</strong> " + cliente.nome +
            "<br>" +
            "<strong>Telefone:</strong> " + cliente.telefone +
            "<br>" +
            "<strong>E-mail:</strong> " + cliente.email +
            "<br>";


        let editar = document.createElement("button");

        editar.textContent = "✏️ Editar";

        editar.className = "editar";

        editar.onclick = function() {

            editarCliente(indice);

        };


        let excluir = document.createElement("button");

        excluir.textContent = "🗑️ Excluir";

        excluir.className = "excluir";

        excluir.onclick = function() {

            excluirCliente(indice);

        };


        item.appendChild(editar);

        item.appendChild(excluir);

        lista.appendChild(item);

    });
}


function editarCliente(indice) {

    document.getElementById("nome").value =
        clientes[indice].nome;

    document.getElementById("telefone").value =
        clientes[indice].telefone;

    document.getElementById("email").value =
        clientes[indice].email;


    clienteEditando = indice;


    document.getElementById("titulo").textContent =
        "Editar cliente";


    document.querySelector(".cadastrar").textContent =
        "Salvar alterações";


    window.scrollTo(0, 0);
}


function excluirCliente(indice) {

    if (confirm("Deseja excluir este cliente?")) {

        clientes.splice(indice, 1);

        localStorage.setItem(
            "clientes",
            JSON.stringify(clientes)
        );

        mostrarClientes();
    }
}


function limparCampos() {

    document.getElementById("nome").value = "";

    document.getElementById("telefone").value = "";

    document.getElementById("email").value = "";
}


mostrarClientes();

</script>

</body>
</html>
